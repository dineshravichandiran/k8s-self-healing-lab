apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: self-healing-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
  namespace: self-healing-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
  namespace: self-healing-lab
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: self-healing-lab
roleRef:
  kind: Role
  name: healer
  apiGroup: rbac.authorization.k8s.io
