apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
subjects:
  - kind: ServiceAccount
    name: healer
roleRef:
  kind: Role
  name: healer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  labels:
    app: healer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healer
  template:
    metadata:
      labels:
        app: healer
    spec:
      serviceAccountName: healer
      containers:
        - name: healer
          image: self-healing-healer:local
          imagePullPolicy: Never
          env:
            - name: HEALER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HEALER_DEPLOYMENT
              value: flaky-service
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
