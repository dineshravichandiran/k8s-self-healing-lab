{{- if .Values.healer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.healer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "self-healing-lab.healerSelector" . | nindent 4 }}
    {{- include "self-healing-lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "self-healing-lab.healerSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "self-healing-lab.healerSelector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.healer.name }}
      containers:
        - name: {{ .Values.healer.name }}
          image: "{{ .Values.healer.image.repository }}:{{ .Values.healer.image.tag }}"
          imagePullPolicy: {{ .Values.healer.image.pullPolicy }}
          env:
            - name: HEALER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HEALER_DEPLOYMENT
              value: {{ .Values.app.name | quote }}
          resources:
            {{- toYaml .Values.healer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
